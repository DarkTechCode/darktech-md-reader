[package]
name = "darktech-md"
version = "0.1.0"
edition = "2024"
authors = ["Dark Wizard <github@darktech.ru>"]
description = "DarkTechMD — быстрая читалка Markdown"
repository = "https://darktech.ru"

[lib]
name = "darktech_md"
path = "src/lib.rs"

[[bin]]
name = "darktech-md"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "clipboard",
    "links",
    "default_fonts",
] }
pulldown-cmark = { version = "0.13", features = ["simd"] }
rfd = "0.15"
sys-locale = "0.3"
env_logger = "0.11"
log = "0.4"

[profile.release]
lto = "thin"
