[package]
name = "darktech-md"
version = "1.0.0"
edition = "2024"
authors = ["Dark Wizard <github@darktech.ru>"]
description = "DarkTechMD — быстрая читалка Markdown"
repository = "https://github.com/DarkTechCode/darktech-md-reader"

[build-dependencies]
# Иконка/версия/метаданные exe (ресурсы Windows).
winres = "0.1"

[lib]
name = "darktech_md"
path = "src/lib.rs"

[[bin]]
name = "darktech-md"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "clipboard",
    "links",
    "default_fonts",
] }
pulldown-cmark = { version = "0.13", features = ["simd"] }
# Запись в клипборд из фонового потока: синхронный SetClipboardData может
# блокировать навсегда (broadcast всем окнам, включая зависшие).
arboard = { version = "3.7", default-features = false, features = ["windows-sys"] }
rfd = "0.15"
sys-locale = "0.3"
env_logger = "0.11"
log = "0.4"
# Настройки: %APPDATA%\DarkTechMD\settings.json (camelCase, как у MarkMello).
serde = { version = "1", features = ["derive"] }
# Поиск по документу: SIMD-поиск подстроки (memmem) в фоновой нити.
memchr = "2"
serde_json = "1"
# Слежение за файлами вкладок: перечитать при изменении (дебаунс 300 мс).
notify = "8"

[target.'cfg(windows)'.dependencies]
# Проверка, что сохранённая позиция окна попадает на существующий монитор;
# perf-тест бюджета памяти (GetProcessMemoryInfo); ассоциация .md (HKCU);
# тема титульной строки (DwmSetWindowAttribute по HWND из eframe).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_UI_Shell",
] }
raw-window-handle = "0.6"
# Подсветка кода (только видимые строки; fancy-regex — чистый Rust, без onig).
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

[profile.release]
# Максимум скорости: полная LTO поверх всех крейтов + один codegen-юнит
# (лучший инлайн/девиртуализация); strip — минус ~2 МБ символов в exe.
lto = "fat"
codegen-units = 1
strip = "symbols"
